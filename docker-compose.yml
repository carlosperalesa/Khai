services:
  bot:
    build: .
    container_name: khai_core
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./other:/app/other
    environment:
      TZ: America/Santiago
      DATA_DIR: /app/data
      KHAI_RUNTIME: docker
      PROXY_URL: http://docker_proxy:8001
      PROXY_TOKEN: ${PROXY_TOKEN:?Define PROXY_TOKEN in .env}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?Define TELEGRAM_WEBHOOK_SECRET in .env}
    networks:
      - control

  docker_proxy:
    build:
      context: .
      dockerfile: docker_proxy/Dockerfile
    container_name: khai_docker_proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    environment:
      TZ: America/Santiago
      DATA_DIR: /app/data
      HOST_DATA_DIR: ${KHAI_HOST_ROOT:?Absolute Linux project path required}/data
      HOST_RUNTIME_DIR: ${KHAI_HOST_ROOT:?Absolute Linux project path required}/app/voice/runtime
      PROXY_TOKEN: ${PROXY_TOKEN:?Define PROXY_TOKEN in .env}
    networks:
      - control

networks:
  control:
    driver: bridge
